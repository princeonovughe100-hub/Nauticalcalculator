<!DOCTYPE html>
<html lang="en">
<head>
<meta name="google-site-verification" content="tOgv3uoIhCg4N8vttyLJ75vL-p_Jk9pR5JvOb-pO8GU" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nautical Calculator</title>
<!-- Nautical Calculator App -->
<!-- Calculates Distance, Speed and Time -->
<!-- 1 knot = 1 nautical mile per hour -->
<!-- 1 nautical mile = 1.852 km -->
<!-- Built for sailors and boat owners -->
<!-- Works on phone and desktop -->
<!-- No login needed -->
<!-- Free to use -->
<!-- Version 1.0 -->
<style>
body { font-family: Arial, sans-serif; background: #0a1a2f; color: #fff; margin: 0; padding: 20px; }
.container { max-width: 500px; margin: auto; background: #122a4a; padding: 20px; border-radius: 12px; }
h1 { text-align: center; color: #4fc3f7; }
label { display: block; margin-top: 15px; font-weight: bold; }
input, select {
  width: 100%; padding: 12px; margin-top: 5px;
  border-radius: 8px; border: none; font-size: 16px; box-sizing: border-box;
}
button {
  width: 100%; padding: 14px; margin-top: 20px;
  background: #4fc3f7; color: #000; font-weight: bold;
  font-size: 17px; border: none; border-radius: 8px;
}
.result {
  margin-top: 20px; background: #fff; color: #000;
  padding: 15px; border-radius: 8px; font-size: 18px; text-align: center;
}
.small { text-align: center; opacity: 0.7; margin-top: 10px; font-size: 13px; }
</style>
</head>
<body>
<div class="container">
<h1>Nautical Calculator</h1>
<label>Calculation Type</label>
<select id="type" onchange="updateLabels()">
<option value="distance">Distance = Speed x Time</option>
<option value="speed">Speed = Distance / Time</option>
<option value="time">Time = Distance / Speed</option>
</select>
<label id="label1">Speed (knots)</label>
<input type="number" id="input1" placeholder="e.g. 12" />
<label id="label2">Time (hours)</label>
<input type="number" id="input2" placeholder="e.g. 5" />
<button onclick="calculate()">Calculate</button>
<div class="result" id="result">Enter values and tap Calculate</div>
<div class="small">1 knot = 1 nautical mile per hour</div>
<div class="small">1 nautical mile = 1.852 km</div>
</div>
<script>
function updateLabels() {
  var t = document.getElementById("type").value;
  var l1 = document.getElementById("label1");
  var l2 = document.getElementById("label2");
  if (t === "distance") {
    l1.textContent = "Speed (knots)";
    l2.textContent = "Time (hours)";
  }
  if (t === "speed") {
    l1.textContent = "Distance (nautical miles)";
    l2.textContent = "Time (hours)";
  }
  if (t === "time") {
    l1.textContent = "Distance (nautical miles)";
    l2.textContent = "Speed (knots)";
  }
}
function calculate() {
  var t = document.getElementById("type").value;
  var a = parseFloat(document.getElementById("input1").value);
  var b = parseFloat(document.getElementById("input2").value);
  var r = document.getElementById("result");
  if (isNaN(a) || isNaN(b) || b === 0) {
    r.textContent = "Please enter valid numbers";
    return;
  }
  if (t === "distance") {
    var d = a * b;
    r.innerHTML = "Distance: <b>" + d.toFixed(2) + " NM</b><br>" + (d * 1.852).toFixed(2) + " km";
  }
  if (t === "speed") {
    var s = a / b;
    r.innerHTML = "Speed: <b>" + s.toFixed(2) + " knots</b>";
  }
  if (t === "time") {
    var tm = a / b;
    var h = Math.floor(tm);
    var m = Math.round((tm - h) * 60);
    r.innerHTML = "Time: <b>" + h + "h " + m + "m</b><br>" + tm.toFixed(2) + " hours";
  }
}
</script>
</body>
</html>
