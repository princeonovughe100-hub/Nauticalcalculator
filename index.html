<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nautical Calculator - For Seafarers - Prince Onovughe</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#0a1a2e;color:white;padding:15px}
h1{text-align:center;color:#29c4e8;font-size:38px;margin:10px 0 5px}
.subtitle{text-align:center;margin:0 0 20px;font-size:17px}
.card{background:#123252;border-radius:15px;padding:20px;margin-bottom:15px}
.card h2{margin:0 0 15px;font-size:22px}
label{display:block;margin:12px 0 5px;font-size:18px}
input{width:100%;padding:14px;border-radius:10px;border:none;font-size:18px;outline:none}
.btn{width:100%;padding:15px;border:none;border-radius:10px;background:#29c4e8;font-size:20px;font-weight:bold;margin-top:15px;cursor:pointer}
.result{width:100%;padding:15px;border:none;border-radius:10px;background:#20e070;color:#000;font-size:19px;font-weight:bold;margin-top:12px;text-align:center}
.small{text-align:center;color:#ccc;font-size:14px;margin-top:20px}
</style>
</head>
<body>

<h1>Calculator</h1>
<p class="subtitle">For Seafarers - Prince Onovughe</p>

<!-- 1. DISTANCE / SPEED / TIME -->
<div class="card">
<h2>1. Distance / Speed / Time</h2>
<label>Distance (Nautical Miles)</label>
<input type="number" id="dist" placeholder="e.g 120">
<label>Speed (Knots)</label>
<input type="number" id="speed" placeholder="e.g 12">
<button class="btn" onclick="calcTime()">Calculate Time</button>
<div class="result" id="result1">Result go show here</div>
</div>

<!-- 2. FUEL -->
<div class="card">
<h2>2. Fuel Consumption</h2>
<label>Fuel per day (MT)</label>
<input type="number" id="fuelDay" placeholder="e.g 20">
<label>Days</label>
<input type="number" id="days" placeholder="e.g 5">
<button class="btn" onclick="calcFuel()">Calculate Total Fuel</button>
<div class="result" id="result2">Result go show here</div>
</div>

<!-- 3. DISTANCE -->
<div class="card">
<h2>3. Find Distance</h2>
<label>Speed (Knots)</label>
<input type="number" id="speed2" placeholder="e.g 12">
<label>Time (Hours)</label>
<input type="number" id="time2" placeholder="e.g 5">
<button class="btn" onclick="calcDist()">Calculate Distance</button>
<div class="result" id="result3">Result go show here</div>
</div>

<!-- 4. ETA -->
<div class="card">
<h2>4. ETA - Arrival Time</h2>
<label>Distance (Nautical Miles)</label>
<input type="number" id="distEta" placeholder="e.g 120">
<label>Speed (Knots)</label>
<input type="number" id="speedEta" placeholder="e.g 12">
<button class="btn" onclick="calcEta()">Calculate ETA</button>
<div class="result" id="result4">Result go show here</div>
</div>

<p class="small">1 knot = 1 nautical mile per hour<br>1 nautical mile = 1.852 km</p>

<script>
function calcTime(){
let d=parseFloat(document.getElementById('dist').value);
let s=parseFloat(document.getElementById('speed').value);
if(!d||!s){document.getElementById('result1').innerText="Enter Distance & Speed";return;}
let t=d/s;
let h=Math.floor(t); let m=Math.round((t-h)*60);
document.getElementById('result1').innerText="Time: "+h+" hrs "+m+" mins ("+t.toFixed(2)+" hrs)";
}
function calcFuel(){
let f=parseFloat(document.getElementById('fuelDay').value);
let dy=parseFloat(document.getElementById('days').value);
if(!f||!dy){document.getElementById('result2').innerText="Enter Fuel & Days";return;}
document.getElementById('result2').innerText="Total Fuel: "+(f*dy).toFixed(2)+" MT";
}
function calcDist(){
let s=parseFloat(document.getElementById('speed2').value);
let t=parseFloat(document.getElementById('time2').value);
if(!s||!t){document.getElementById('result3').innerText="Enter Speed & Time";return;}
let d=s*t;
document.getElementById('result3').innerText="Distance: "+d.toFixed(2)+" NM ("+(d*1.852).toFixed(2)+" km)";
}
function calcEta(){
let d=parseFloat(document.getElementById('distEta').value);
let s=parseFloat(document.getElementById('speedEta').value);
if(!d||!s){document.getElementById('result4').innerText="Enter Distance & Speed";return;}
let t=d/s; let now=new Date(); now.setHours(now.getHours()+t);
document.getElementById('result4').innerText="Sailing Time: "+t.toFixed(2)+" hrs | ETA: "+now.toLocaleString();
}
</script>
</body>
</html>
