<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nautical Calculator</title>
<style>
body{font-family:Arial;background:#0a1a2f;color:white;padding:15px;text-align:center}
h1{color:#00d4ff}
.box{background:#132e4d;padding:15px;border-radius:12px;margin:12px 0;text-align:left}
label{display:block;margin:8px 0 4px}
input,select{width:100%;padding:10px;border-radius:8px;border:none;font-size:16px}
button{width:100%;padding:12px;background:#00d4ff;border:none;border-radius:8px;font-size:18px;font-weight:bold;margin-top:10px}
.result{background:#00ff88;color:#000;padding:12px;border-radius:8px;margin-top:10px;font-weight:bold;text-align:center}
</style>
</head>
<body>
<h1>⚓ Nautical Calculator</h1>
<p>For Seafarers - Prince Onovughe</p>

<div class="box">
<h3>1. Distance / Speed / Time</h3>
<label>Distance (Nautical Miles)</label>
<input type="number" id="dist" placeholder="e.g 120">
<label>Speed (Knots)</label>
<input type="number" id="speed" placeholder="e.g 12">
<button onclick="calcTime()">Calculate Time</button>
<div class="result" id="timeResult">Result go show here</div>
</div>

<div class="box">
<h3>2. Fuel Consumption</h3>
<label>Fuel per day (MT)</label>
<input type="number" id="fuelDay" placeholder="e.g 20">
<label>Days</label>
<input type="number" id="days" placeholder="e.g 5">
<button onclick="calcFuel()">Calculate Total Fuel</button>
<div class="result" id="fuelResult">Result go show here</div>
</div>

<div class="box">
<h3>3. ETA Calculator</h3>
<label>Distance (NM)</label>
<input type="number" id="etaDist" placeholder="e.g 240">
<label>Speed (Knots)</label>
<input type="number" id="etaSpeed" placeholder="e.g 10">
<button onclick="calcETA()">Calculate ETA</button>
<div class="result" id="etaResult">Result go show here</div>
</div>

<script>
function calcTime(){
let d=document.getElementById('dist').value;
let s=document.getElementById('speed').value;
if(!d||!s){alert('Fill distance and speed');return}
let t=d/s;
document.getElementById('timeResult').innerText='Time = '+t.toFixed(2)+' Hours = '+(t*60).toFixed(0)+' Minutes';
}
function calcFuel(){
let f=document.getElementById('fuelDay').value;
let d=document.getElementById('days').value;
if(!f||!d){alert('Fill fuel and days');return}
document.getElementById('fuelResult').innerText='Total Fuel Needed = '+(f*d).toFixed(2)+' MT';
}
function calcETA(){
let d=document.getElementById('etaDist').value;
let s=document.getElementById('etaSpeed').value;
if(!d||!s){alert('Fill distance and speed');return}
let t=d/s;
let now=new Date();
now.setHours(now.getHours()+t);
document.getElementById('etaResult').innerText='Sailing Time: '+t.toFixed(2)+' Hours. ETA: '+now.toLocaleString();
}
</script>
</body>
</html>
